[pytest]
DJANGO_SETTINGS_MODULE = securityhub.settings_test
; Match Django's traditional single-file "tests.py" convention (e.g.
; vulnerability/tests.py) in addition to pytest's own test_*.py/*_test.py -
; otherwise bare `pytest` silently skips any app still using tests.py.
python_files = tests.py test_*.py *_test.py
