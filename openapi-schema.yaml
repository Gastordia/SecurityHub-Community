          description: No response body
  /api/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: |-
        Readiness probe endpoint.

        Checks if the application is ready to serve traffic.
        Verifies database and cache connectivity.
        Used by load balancers to determine routing.

        **No authentication required** - this is a health check endpoint.

        **Example**:
            GET /api/health/ready/

        **Response** (Ready):
            {
                "status": "ready",
                "service": "SecurityHub API",
                "timestamp": 1703520000.123,
                "checks": {
                    "database": {
                        "healthy": true,
                        "message": "Database connection successful",
                        "response_time_ms": 2.34
                    },
                    "cache": {
                        "healthy": true,
                        "message": "Cache connection successful",
                        "response_time_ms": 1.23
                    }
                }
            }

        **Response** (Not Ready):
            HTTP 503 Service Unavailable
            {
                "status": "not_ready",
                ...
            }
      tags:
      - health
      security:
      - CustomAuthentication: []
      - Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Detailed health check endpoint.

        Provides comprehensive status of all application components:
        - Database (PostgreSQL)
        - Cache

        Includes response times and detailed metrics.

        **No authentication required** - this is a health check endpoint.

        **Example**:
            GET /api/health/

        **Response** (Healthy):
            {
                "status": "healthy",
                "service": "SecurityHub API",
                "version": "1.0.0",
                "timestamp": 1703520000.123,
                "components": {
                    "database": {
                        "healthy": true,
                        "message": "Database connection successful",
                        "response_time_ms": 2.34,
                        "type": "postgresql",
                        "critical": true
                    },
                    "cache": {
                        "healthy": true,
                        "message": "Cache connection successful",
                        "response_time_ms": 1.23,
                        "type": "locmem",
                        "critical": true
                    },
                        "critical": false
                    }
                },
                "summary": {
                    "total_checks": 2,
                    "passed": 3,
                    "failed": 0,
                    "critical_passed": 2,
                    "critical_failed": 0
                }
            }

        **Status Codes**:
            - 200: Healthy or Degraded (critical components ok)
            - 503: Unhealthy (critical components failing)
      tags:
      - health
      security:
      - CustomAuthentication: []
      - Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: No response body
