components:
  schemas:
    MyTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        username:
          type: string
          writeOnly: true
      required:
      - password
    PaginatedVulnDBserializersList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/VulnDBserializers'
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    VulnDBserializers:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        vulnerabilityname:
          type: string
          description: Vulnerability name/title
          maxLength: 300
        vulnerabilityseverity:
          type: string
          description: Basic severity level
          maxLength: 300
        vulnerabilitydescription:
          type: string
          description: Vulnerability description
        vulnerabilitysolution:
          type: string
          description: Recommended solution
        vulnerabilityreferlnk:
          type: string
          nullable: true
          description: Reference links
        cvssscore:
          type: number
          format: double
          nullable: true
          description: Base CVSS score
        cvssvector:
          type: string
          nullable: true
          description: CVSS vector string
          maxLength: 300
        cwe:
          nullable: true
          description: CWE IDs
        is_active:
          type: boolean
          description: Template is active
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Template created date
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Template last updated
      required:
      - vulnerabilitydescription
      - vulnerabilityname
      - vulnerabilityseverity
      - vulnerabilitysolution
  securitySchemes:
    CustomAuthentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: User authentication and token management
- name: Users
  description: User management and permissions
- name: Customers
  description: Customer management and dashboards
- name: Projects
  description: Project management and lifecycle
- name: Vulnerabilities
  description: Vulnerability management
- name: Scopes
  description: Project scope management
- name: Dashboard
  description: Analytics and dashboard APIs
- name: Parser
  description: Scanner integration and file parsing
- name: Configuration
  description: System configuration and health checks
