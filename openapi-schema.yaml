                "status": "alive",
                "service": "SecurityHub API",
                "timestamp": 1703520000.123
            }
      tags:
      - health
      security:
      - CustomAuthentication: []
      - Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
