name: Docker Build and Test

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - 'securityhub/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - 'securityhub/**'

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile_API
          push: false
          tags: securityhub-api:test
          cache-from: type=gha
          # mode=max caches every intermediate layer and is the well-documented
          # trigger for buildx's GHA-cache-exporter "error writing layer blob:
          # not_found" flake. mode=min (final-stage layers only) is the standard
          # mitigation - slightly less cache reuse, much less flaky.
          cache-to: type=gha,mode=min

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile_frontend
          push: false
          tags: securityhub-frontend:test
          cache-from: type=gha
          # mode=max caches every intermediate layer and is the well-documented
          # trigger for buildx's GHA-cache-exporter "error writing layer blob:
          # not_found" flake. mode=min (final-stage layers only) is the standard
          # mitigation - slightly less cache reuse, much less flaky.
          cache-to: type=gha,mode=min

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: docker-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cp env.docker .env || echo "env.docker not found, using defaults"
          # Ensure required env vars are set
          echo "POSTGRES_USER=securityhub_user" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "POSTGRES_DB=securityhub" >> .env
          echo "POSTGRES_HOST=postgres" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "REDIS_PASSWORD=test_redis_password" >> .env
          echo "REDIS_URL=redis://:test_redis_password@redis:6379/" >> .env
          echo "SECRET_KEY=test-secret-key-for-ci-only" >> .env
          echo 'WHITELIST_IP=["http://127.0.0.1:8080","http://127.0.0.1:8000"]' >> .env
          echo 'ALLOWED_HOST=["127.0.0.1","localhost","*"]' >> .env
          echo 'CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080,http://127.0.0.1:5000' >> .env
          echo "USE_DOCKER=True" >> .env

      - name: Start services
        run: |
          docker compose up -d --wait

      - name: Wait for services to be healthy
        run: |
          timeout 60 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done'

      - name: Run tests
        run: |
          docker compose exec -T securityhub python3 /home/securityhub/securityhub/securityhub/manage.py test --noinput || true

      - name: Check service health
        if: always()
        run: |
          docker compose ps

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs securityhub postgres nginx || true

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
