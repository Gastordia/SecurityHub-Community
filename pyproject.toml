[project]
name = "securityhub"
version = "1.0.0"
description = "SecurityHub is a Python and Django-based enterprise vulnerability management platform designed for penetration testers and security organizations. It streamlines report generation by enabling users to create PDF and DOCX reports directly, and provides a systematic way to monitor and manage vulnerabilities within various projects."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "SecurityHub Community" },
]
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "django==4.2.30",
    "djangorestframework==3.15.2",
    "gunicorn==23.0.0",
    "pillow==12.3.0",
    "pytz==2022.6",
    "sqlparse==0.5.5",
    "tzdata>=2024.1,<2025.0",
    "django-cors-headers==3.13.0",
    "djangorestframework-simplejwt==5.5.1",
    "pyjwt==2.13.0",
    "colorlog==6.7.0",
    "django-filter==23.5",
    "python-dotenv==1.2.2",
    "weasyprint>=68.0,<69.0",
    "pydyf>=0.10.0,<0.12.0",
    "pygal==3.0.4",
    "bleach[css]>=6.4.0,<7.0.0",
    "whitenoise==6.6.0",
    "docxtpl==0.18.0",
    "redis==5.0.1",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "django-redis>=5.4.0,<6.0.0",
    "boto3>=1.34.159,<2.0.0",
    "django-storages>=1.14.4,<2.0.0",
    "bs4>=0.0.2,<0.1.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "requests>=2.33.0,<3.0.0",
    "defusedxml>=0.7.1,<0.8.0",
    "html2text>=2020.1.16,<2021.0.0",
    "cvss>=2.5,<3.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "hyperlink>=21.0.0,<22.0.0",
    "drf-spectacular>=0.28.0,<0.29.0",
    "python-magic>=0.4.27,<0.5.0",
    "docxcompose>=1.4.0,<2.0.0",
    "django-timezone-field>=7.0.0,<8.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "lxml>=6.1.0,<7.0.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.3.0,<5.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-django>=4.11.1,<5.0.0",
    "coverage>=7.10.6,<8.0.0",
]
intelligence-tests = [
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "responses>=0.23.0,<0.24.0",
    "httpretty>=1.1.4,<2.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "flake8>=6.0.0,<7.0.0",
    "black>=26.3.1,<27.0.0",
    "isort>=5.12.0,<6.0.0",
    "factory-boy>=3.2.0,<4.0.0",
    "faker>=18.0.0,<19.0.0",
]

[tool.bandit]
# Triaged 2026-07-05. Test files legitimately use `assert` (B101) and literal
# password strings in fixtures (B105/B106) - neither is a real finding there.
# template_sandbox.py generates fake preview data for report templates (fake
# project names, CVSS scores, finding counts) via `random` - not a
# security-sensitive context, so its B106/B311 hits are excluded too rather
# than sprinkling 23 inline `# nosec` comments across one file.
exclude_dirs = [
    "securityhub/tests",
    "securityhub/*/tests",
    "securityhub/*/tests.py",
    "securityhub/*/migrations",
    "securityhub/configapi/services/template_sandbox.py",
]
# B105/B106/B107 (hardcoded password string/funcarg/default) checked every
# remaining hit outside the paths above: all were `token_type == 'invitation'`,
# `token_prefix='Bearer'`, `TOKEN_TYPE_CLAIM: 'token_type'` - Bandit's keyword
# list treats "token" as password-adjacent, so any code naming a token *type*
# (as opposed to a token *value*) triggers it. Zero true positives found.
skips = ["B105", "B106", "B107"]
